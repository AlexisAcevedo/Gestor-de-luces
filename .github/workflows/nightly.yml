name: Nightly flake check

on:
  schedule:
    # 03:17 UTC: off-peak, and not on the hour, when GitHub's queue is congested.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeated-tests:
    name: pytest x5 (Python 3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # One pass per process. `--count` (pytest-repeat) repeated every test inside the same
      # process, so a nightly failure mixed a real defect with the state left behind by the
      # previous passes (bridge threads, UDP sockets, native samplers). Five fresh processes
      # make a nightly failure mean exactly what a `ci.yml` failure means, which is the only
      # actionable thing for whoever reads the notification.
      # `--timeout` comes from pytest-timeout: no single test may hang for over two minutes.
      - name: Run the whole suite five times
        shell: bash
        run: |
          for pass in 1 2 3 4 5; do
            echo "::group::Pass $pass of 5"
            pytest -x --timeout=120 || exit $?
            echo "::endgroup::"
          done
