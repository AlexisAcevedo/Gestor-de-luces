[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gestor-luces"
version = "0.2.1"
description = "Hexagonal desktop light manager for Philips WiZ smart bulbs over local UDP."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
