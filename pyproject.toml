[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gestor-luces"
version = "0.3.1"
description = "Hexagonal desktop light manager for Philips WiZ smart bulbs over local UDP."
requires-python = ">=3.12"
authors = [{ name = "AlexisAcevedo", email = "alexis.acevedo@outlook.com" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Core WiZ light communication (UDP 38899)
    "pywizlight==0.6.6",
    # Desktop container (WebView2 / Edge Chromium)
    "pywebview==6.2.1",
    # System tray icon and image generation
    "pystray==0.19.5",
    "Pillow==13.0.0",
    # Screen capture for Ambilight (Win32 GDI, pure Python)
    "mss==10.2.0",
    # System audio capture (WASAPI loopback) and signal processing
    "PyAudioWPatch==0.2.12.9",
    "numpy==2.5.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-timeout==2.4.0",
    "pytest-repeat==0.9.4",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "ruff==0.17.4",
    # Packaging (portable build and installer, see scripts/build.ps1)
    "pyinstaller==6.22.3",
]

[project.urls]
Repository = "https://github.com/AlexisAcevedo/Gestor-de-luces"

[project.scripts]
gestor-luces = "gestor_luces.main:main"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
